name: Deploy

# 11일: package.json homepage (예: /wedding-invitation/)
# 18일: 같은 Pages 사이트 아래 /wedding-invitation/fa/ (homepage 경로 + fa/)
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Environment Variables
        run: |
          echo "VITE_NAVER_MAP_CLIENT_ID=$VITE_NAVER_MAP_CLIENT_ID
          VITE_KAKAO_SDK_JS_KEY=$VITE_KAKAO_SDK_JS_KEY
          VITE_SERVER_URL=$VITE_SERVER_URL
          VITE_STATIC_ONLY=$VITE_STATIC_ONLY" >> .env
        env:
          VITE_NAVER_MAP_CLIENT_ID: ${{ secrets.VITE_NAVER_MAP_CLIENT_ID }}
          VITE_KAKAO_SDK_JS_KEY: ${{ secrets.VITE_KAKAO_SDK_JS_KEY }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_STATIC_ONLY: ${{ vars.VITE_STATIC_ONLY }}

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Vite base path for /fa/ subsite
        id: fa_base
        run: |
          FA_BASE=$(node -e "const h=require('./package.json').homepage; const p=new URL(h).pathname.replace(/\/$/,''); console.log(p+'/fa/')")
          echo "path=$FA_BASE" >> $GITHUB_OUTPUT

      - name: Build main site (4/11)
        run: npm run build

      - name: Stage main site
        run: mkdir -p deploy && cp -r build/* deploy/

      - name: Build fa subsite (4/18)
        run: npm run build
        env:
          VITE_WEDDING_DATE_VARIANT: fa
          VITE_BASE_PATH: ${{ steps.fa_base.outputs.path }}

      - name: Stage fa subsite
        run: mkdir -p deploy/fa && cp -r build/* deploy/fa/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./deploy"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
